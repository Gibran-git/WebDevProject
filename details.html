<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
        <title>Artwork Details</title>
    </head>
    <body>
        <main>
            <section id="artwork-details">
            
               <img src="https://via.placeholder.com/400" alt="Artwork Image" width="400" height="400">

               <h1>
                Artwork Title Here
               </h1>

               <h2>
                Artist Name Here
               </h2>

               <p>Artwork Description Here</p>

               <p>Tag1     Tag2     Tag3</p>
            </section>

            <section id="comment-section">
                <h2>Add a Comment </h2>
                <form id = "comment-form">
                    <label for = "comment">Your comment:</label>
                
                    <textarea 
                        id = "comment" 
                        name = "comment" 
                        rows = "6" 
                        maxlength = "500"
                        placeholder = "Write your comment here..."
                    ></textarea>

                    <p class = "helper"> Maximum 500 characters.</p>
                    <p id = "comment-error" class = "error"></p>
                    <button type = "submit"> Submit Comment </button>
                </form>
            </section>

        </main>

    </body>
</html>
